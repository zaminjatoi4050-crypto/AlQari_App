name: Build complete AlQari APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: alqari-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and validate full Quran data
        run: python scripts/fetch_data.py
      - name: Validate audio edition IDs and representative audio URLs
        run: python scripts/validate_audio_sources.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding without touching Dart source
        shell: bash
        run: |
          rm -rf android_scaffold
          flutter create --platforms=android --project-name=al_qari_app --org=com.alqari android_scaffold
          cp -R android_scaffold/android ./android
          rm -rf android_scaffold

      - name: Set AlQari app label, permissions and launcher icon
        run: python scripts/patch_android_manifest.py

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run project tests
        run: flutter test

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlQari-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete updated source project
        shell: bash
        run: |
          zip -r AlQariApp-Updated-Source.zip . \
            -x '.git/*' './.git/*' \
               '.dart_tool/*' './.dart_tool/*' \
               'build/*' './build/*' \
               'android/.gradle/*' './android/.gradle/*' \
               'android/local.properties' './android/local.properties' \
               'AlQariApp-Updated-Source.zip'

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AlQari-Updated-Source-ZIP
          path: AlQariApp-Updated-Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload data manifest for provenance
        uses: actions/upload-artifact@v4
        with:
          name: AlQari-Data-Manifest
          path: assets/data/data_manifest.json
          if-no-files-found: error
          retention-days: 30
