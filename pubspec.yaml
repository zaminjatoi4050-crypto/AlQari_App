name: al_qari
description: Offline-first full Quran reader and word-analysis companion in English, Urdu, and Sindhi.
publish_to: "none"
version: 1.8.0+10

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  flutter_tts: ^4.2.3
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.3
  geolocator: ^14.1.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/al_qari_icon.png
