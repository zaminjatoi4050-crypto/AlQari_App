name: al_qari
description: Offline-first full Quran reader and word-analysis companion in English, Urdu, and Sindhi.
publish_to: "none"
version: 1.5.0+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/al_qari_icon.png
